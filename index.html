<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<title>Topartowe Mistrzostwa w Triki — TV</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#07071a; color:white; font-family:'Nunito',sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

  /* ── HEADER ── */
  .tv-header { background:linear-gradient(135deg,#1a1a3e,#0d0d2b); border-bottom:3px solid #f59e0b; padding:10px 32px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .tv-header h1 { font-family:'Orbitron',sans-serif; font-size:1.5rem; font-weight:900; background:linear-gradient(90deg,#f59e0b,#fff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:0.06em; }
  .tv-header .sub { font-size:0.65rem; color:#64748b; letter-spacing:0.18em; text-transform:uppercase; font-weight:700; }
  .header-right { display:flex; align-items:center; gap:16px; }
  .live-badge { display:flex; align-items:center; gap:7px; background:rgba(239,68,68,0.12); border:1px solid #ef4444; border-radius:20px; padding:5px 14px; font-size:0.75rem; font-weight:800; color:#ef4444; letter-spacing:0.12em; }
  .live-dot { width:8px; height:8px; background:#ef4444; border-radius:50%; animation:blink 1.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── VIEW TOGGLE ── */
  .view-tabs { display:flex; gap:0; border:1px solid #334155; border-radius:10px; overflow:hidden; }
  .view-tab { padding:6px 18px; font-size:0.75rem; font-weight:800; cursor:pointer; background:transparent; color:#475569; border:none; font-family:'Nunito',sans-serif; letter-spacing:0.06em; transition:all 0.2s; }
  .view-tab.active { background:#f59e0b; color:#0d0d2b; }

  /* ── VIEWS ── */
  .view { flex:1; display:none; overflow:hidden; }
  .view.active { display:flex; }

  /* ── RANKING VIEW (4 cols) ── */
  #view-ranking { flex-direction:column; }
  .grid { flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:0; overflow:hidden; }
  .col { display:flex; flex-direction:column; border-right:1px solid #1e293b; overflow:hidden; }
  .col:last-child { border-right:none; }
  .col-header { padding:10px 16px 8px; border-bottom:2px solid; flex-shrink:0; display:flex; align-items:center; }
  .col-header .game-name { font-family:'Orbitron',sans-serif; font-size:0.9rem; font-weight:900; letter-spacing:0.04em; }
  .col-header .game-count { font-size:0.65rem; color:#475569; font-weight:700; margin-left:auto; }
  .col-ninja .col-header { border-color:#22c55e44; } .col-ninja .game-name,.col-ninja .score { color:#22c55e; }
  .col-bokser .col-header { border-color:#ef444444; } .col-bokser .game-name,.col-bokser .score { color:#ef4444; }
  .col-toss .col-header { border-color:#f59e0b44; } .col-toss .game-name,.col-toss .score { color:#f59e0b; }
  .col-snake .col-header { border-color:#10b98144; } .col-snake .game-name,.col-snake .score { color:#10b981; }
  .col-body { flex:1; overflow:hidden; padding:6px 0; display:flex; flex-direction:column; gap:2px; }
  .row { display:flex; align-items:center; gap:10px; padding:9px 16px; animation:fadeIn 0.35s ease both; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  .row-1 { background:linear-gradient(90deg,rgba(251,191,36,0.13),transparent); }
  .row-2 { background:linear-gradient(90deg,rgba(148,163,184,0.08),transparent); }
  .row-3 { background:linear-gradient(90deg,rgba(180,120,60,0.08),transparent); }
  .medal { font-size:1.4rem; width:30px; text-align:center; flex-shrink:0; }
  .pos { font-family:'Orbitron',sans-serif; font-size:0.85rem; font-weight:900; color:#334155; width:30px; text-align:center; flex-shrink:0; }
  .name { font-size:1rem; font-weight:800; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score { font-family:'Orbitron',sans-serif; font-size:1.15rem; font-weight:900; flex-shrink:0; }
  .jury-tag { font-size:0.55rem; color:#64748b; font-weight:700; font-family:'Nunito',sans-serif; }
  .empty { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:#1e293b; font-size:0.85rem; }
  .empty .ico { font-size:2.5rem; }

  /* ── SNAKE 1V1 TURNIEJ VIEW ── */
  #view-1v1 { flex-direction:column; padding:20px 40px; gap:20px; overflow:hidden; }
  .turniej-title { font-family:'Orbitron',sans-serif; font-size:1.4rem; font-weight:900; color:#8b5cf6; display:flex; align-items:center; gap:12px; border-bottom:2px solid #8b5cf644; padding-bottom:12px; flex-shrink:0; }
  .turniej-title .badge { background:#8b5cf6; color:white; font-size:0.65rem; padding:4px 12px; border-radius:10px; font-family:'Nunito',sans-serif; letter-spacing:0.1em; }
  .turniej-layout { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:24px; overflow:hidden; }

  /* Standings */
  .standings { display:flex; flex-direction:column; gap:0; overflow:hidden; }
  .standings h3 { font-family:'Orbitron',sans-serif; font-size:0.8rem; color:#64748b; letter-spacing:0.12em; margin-bottom:10px; flex-shrink:0; }
  .standings-list { flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
  .standing-row { display:flex; align-items:center; gap:14px; padding:12px 18px; border-radius:12px; background:rgba(139,92,246,0.06); border:1px solid rgba(139,92,246,0.12); animation:fadeIn 0.35s ease both; }
  .standing-row-1 { background:linear-gradient(90deg,rgba(251,191,36,0.15),rgba(139,92,246,0.06)); border-color:rgba(251,191,36,0.3); }
  .standing-row-2 { background:linear-gradient(90deg,rgba(148,163,184,0.1),rgba(139,92,246,0.06)); border-color:rgba(148,163,184,0.2); }
  .standing-row-3 { background:linear-gradient(90deg,rgba(180,120,60,0.1),rgba(139,92,246,0.06)); border-color:rgba(180,120,60,0.2); }
  .s-medal { font-size:1.5rem; width:32px; text-align:center; flex-shrink:0; }
  .s-pos { font-family:'Orbitron',sans-serif; font-size:0.9rem; font-weight:900; color:#334155; width:32px; text-align:center; flex-shrink:0; }
  .s-name { font-size:1.1rem; font-weight:800; flex:1; }
  .s-wins { font-family:'Orbitron',sans-serif; font-size:1.4rem; font-weight:900; color:#8b5cf6; }
  .s-wins span { font-size:0.6rem; color:#64748b; font-family:'Nunito',sans-serif; }

  /* Recent matches */
  .matches { display:flex; flex-direction:column; overflow:hidden; }
  .matches h3 { font-family:'Orbitron',sans-serif; font-size:0.8rem; color:#64748b; letter-spacing:0.12em; margin-bottom:10px; flex-shrink:0; }
  .matches-list { flex:1; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
  .match-card { display:flex; align-items:center; gap:0; border-radius:12px; overflow:hidden; border:1px solid rgba(139,92,246,0.15); animation:fadeIn 0.35s ease both; flex-shrink:0; }
  .match-winner { background:rgba(139,92,246,0.2); padding:12px 16px; font-size:1rem; font-weight:800; color:#a78bfa; flex:1; }
  .match-vs { background:#0d0d2b; padding:12px 10px; font-size:0.7rem; color:#334155; font-weight:700; flex-shrink:0; text-align:center; }
  .match-loser { background:rgba(255,255,255,0.02); padding:12px 16px; font-size:1rem; font-weight:700; color:#475569; flex:1; text-align:right; }
  .match-trophy { font-size:1rem; margin-right:6px; }

  /* ── FOOTER ── */
  .tv-footer { background:#0d0d2b; border-top:1px solid #1e293b; padding:6px 32px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .tv-footer span { font-size:0.65rem; color:#334155; letter-spacing:0.08em; }
</style>
</head>
<body>

<div class="tv-header">
  <div>
    <div class="sub">Topartowe Mistrzostwa w</div>
    <h1>TRIKI</h1>
  </div>
  <div class="header-right">
    <div class="view-tabs">
      <button class="view-tab active" onclick="switchView('ranking')">🏆 Ranking</button>
      <button class="view-tab" onclick="switchView('1v1')">⚔️ Snake 1v1</button>
    </div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </div>
</div>

<!-- RANKING VIEW -->
<div class="view active" id="view-ranking">
  <div class="grid">
    <div class="col col-ninja">
      <div class="col-header"><span class="game-name">🥷 Ninja Frog</span><span class="game-count" id="cnt-ninja"></span></div>
      <div class="col-body" id="list-ninja"></div>
    </div>
    <div class="col col-bokser">
      <div class="col-header"><span class="game-name">🥊 Bokser</span><span class="game-count" id="cnt-bokser"></span></div>
      <div class="col-body" id="list-bokser"></div>
    </div>
    <div class="col col-toss">
      <div class="col-header"><span class="game-name">🎯 Toss</span><span class="game-count" id="cnt-toss"></span></div>
      <div class="col-body" id="list-toss"></div>
    </div>
    <div class="col col-snake">
      <div class="col-header"><span class="game-name">🐍 Snake</span><span class="game-count" id="cnt-snake"></span></div>
      <div class="col-body" id="list-snake"></div>
    </div>
  </div>
</div>

<!-- SNAKE 1V1 VIEW -->
<div class="view" id="view-1v1">
  <div class="turniej-title">
    🐍 Snake 1v1 — Turniej
    <span class="badge">MULTIPLAYER</span>
    <span id="match-count" style="font-size:0.7rem;color:#64748b;font-family:'Nunito',sans-serif;font-weight:700;margin-left:auto;"></span>
  </div>
  <div class="turniej-layout">
    <div class="standings">
      <h3>KLASYFIKACJA GENERALNA</h3>
      <div class="standings-list" id="standings-list"></div>
    </div>
    <div class="matches">
      <h3>OSTATNIE MECZE</h3>
      <div class="matches-list" id="matches-list"></div>
    </div>
  </div>
</div>

<div class="tv-footer">
  <span>LIVE — aktualizuje się automatycznie</span>
  <span>top-art-agency.github.io/Ranking-Triki/</span>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBTOosW_Gy6iO5SnRo47tYzGcGJPqbvF2E",authDomain:"ninja-frog-ranking.firebaseapp.com",databaseURL:"https://ninja-frog-ranking-default-rtdb.europe-west1.firebasedatabase.app",projectId:"ninja-frog-ranking",storageBucket:"ninja-frog-ranking.firebasestorage.app",messagingSenderId:"425653435372",appId:"1:425653435372:web:cb549a5773deb7b82ddec9"});
var db = firebase.database();
const MAX = 14;

function switchView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.view-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  event.target.classList.add('active');
}

function medal(i) {
  if(i===0) return '<span class="medal">🥇</span>';
  if(i===1) return '<span class="medal">🥈</span>';
  if(i===2) return '<span class="medal">🥉</span>';
  return `<span class="pos">${i+1}</span>`;
}
function sMedal(i) {
  if(i===0) return '<span class="s-medal">🥇</span>';
  if(i===1) return '<span class="s-medal">🥈</span>';
  if(i===2) return '<span class="s-medal">🥉</span>';
  return `<span class="s-pos">${i+1}</span>`;
}

function loadGame(key) {
  db.ref(key).on('value', snap => {
    const list = document.getElementById('list-'+key);
    const cnt  = document.getElementById('cnt-'+key);
    const data = snap.val() || {};
    const entries = Object.values(data)
      .sort((a,b) => (b.score+(b.jury||0)) - (a.score+(a.jury||0)))
      .slice(0, MAX);
    cnt.textContent = entries.length ? entries.length+' graczy' : '';
    if (!entries.length) {
      list.innerHTML = '<div class="empty"><div class="ico">🎮</div><div>Brak wyników</div></div>';
      return;
    }
    list.innerHTML = entries.map((e,i) => {
      const total = e.score+(e.jury||0);
      const j = e.jury ? `<span class="jury-tag">+${e.jury}j</span>` : '';
      return `<div class="row row-${i<3?i+1:0}" style="animation-delay:${i*0.04}s">
        ${medal(i)}<span class="name">${e.name}</span><span class="score">${total}${j}</span>
      </div>`;
    }).join('');
  });
}

function loadSnake1v1() {
  db.ref('snake1v1').on('value', snap => {
    const data = snap.val() || {};
    const matches = Object.values(data).filter(m => m.winner);

    // Count
    document.getElementById('match-count').textContent = matches.length + ' meczów rozegranych';

    // Standings
    const wins = {};
    matches.forEach(m => { wins[m.winner] = (wins[m.winner]||0)+1; });
    const sorted = Object.entries(wins).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const sl = document.getElementById('standings-list');
    if (!sorted.length) {
      sl.innerHTML = '<div class="empty"><div class="ico">⚔️</div><div>Brak meczów</div></div>';
    } else {
      sl.innerHTML = sorted.map(([name,w],i) =>
        `<div class="standing-row standing-row-${i<3?i+1:0}" style="animation-delay:${i*0.05}s">
          ${sMedal(i)}
          <span class="s-name">${name}</span>
          <span class="s-wins">${w}<span> W</span></span>
        </div>`
      ).join('');
    }

    // Recent matches (last 6)
    const recent = matches.slice(-6).reverse();
    const ml = document.getElementById('matches-list');
    if (!recent.length) {
      ml.innerHTML = '<div class="empty"><div class="ico">🏟️</div><div>Brak meczów</div></div>';
    } else {
      ml.innerHTML = recent.map((m,i) =>
        `<div class="match-card" style="animation-delay:${i*0.05}s">
          <div class="match-winner"><span class="match-trophy">🏆</span>${m.winner}</div>
          <div class="match-vs">VS</div>
          <div class="match-loser">${m.loser||'?'}</div>
        </div>`
      ).join('');
    }
  });
}

['ninja','bokser','toss','snake'].forEach(loadGame);
loadSnake1v1();
</script>
</body>
</html>
