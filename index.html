<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Żabkowe Mistrzostwa w Triki — TV</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07071a;color:white;font-family:'Nunito',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,#1a1a3e,#0d0d2b);border-bottom:3px solid #f59e0b;padding:10px 32px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr h1{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;background:linear-gradient(90deg,#f59e0b,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.06em}
.hdr .sub{font-size:.6rem;color:#64748b;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.live{display:flex;align-items:center;gap:7px;background:rgba(239,68,68,.12);border:1px solid #ef4444;border-radius:20px;padding:5px 14px;font-size:.75rem;font-weight:800;color:#ef4444;letter-spacing:.12em}
.dot{width:8px;height:8px;background:#ef4444;border-radius:50%;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.nav{display:flex;background:#0d0d2b;border-bottom:1px solid #1e293b;flex-shrink:0;overflow-x:auto}
.nb{padding:14px 26px;font-size:1.1rem;font-weight:800;cursor:pointer;background:transparent;color:#475569;border:none;border-bottom:3px solid transparent;font-family:'Nunito',sans-serif;letter-spacing:.04em;transition:all .2s;white-space:nowrap}
.nb.active{color:var(--c);border-bottom-color:var(--c);background:rgba(255,255,255,.03)}
.view{flex:1;display:none;flex-direction:column;overflow:hidden}
.view.active{display:flex}
/* ALL GRID */
.all-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}
.ac{display:flex;flex-direction:column;border-right:1px solid #1e293b;overflow:hidden}
.ac:last-child{border-right:none}
.ac-galaxy{--c:#a855f7}
.ac-hdr{padding:12px 16px 10px;border-bottom:2px solid var(--c);font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:var(--c);flex-shrink:0}
.ac-list{flex:1;overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.ar{display:flex;align-items:center;gap:8px;padding:7px 12px}
.ar1{background:linear-gradient(90deg,rgba(251,191,36,.13),transparent)}
.ar2{background:linear-gradient(90deg,rgba(148,163,184,.08),transparent)}
.ar3{background:linear-gradient(90deg,rgba(180,120,60,.08),transparent)}
.am{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}
.ap{font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:900;color:#334155;width:24px;text-align:center;flex-shrink:0}
.an{font-size:.85rem;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:900;color:var(--c);flex-shrink:0}
/* SINGLE GAME */
.g-hdr{padding:20px 40px 12px;display:flex;align-items:baseline;gap:16px;flex-shrink:0}
.g-title{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900}
.g-cnt{font-size:.85rem;color:#475569;font-weight:700}
.g-list{flex:1;overflow-y:auto;padding:0 40px 20px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.en{display:flex;align-items:center;gap:16px;padding:12px 20px;border-radius:12px;margin-bottom:6px}
.en1{background:linear-gradient(90deg,rgba(251,191,36,.18),rgba(251,191,36,.04));border:1px solid rgba(251,191,36,.3)}
.en2{background:linear-gradient(90deg,rgba(148,163,184,.12),rgba(148,163,184,.02));border:1px solid rgba(148,163,184,.2)}
.en3{background:linear-gradient(90deg,rgba(180,120,60,.12),rgba(180,120,60,.02));border:1px solid rgba(180,120,60,.2)}
.enn{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05)}
.em{font-size:1.8rem;width:40px;text-align:center;flex-shrink:0}
.ep{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:#334155;width:40px;text-align:center;flex-shrink:0}
.ename{font-size:1.2rem;font-weight:800;flex:1}
.escore{font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:900;flex-shrink:0}
.ezap{font-size:.7rem;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);border-radius:20px;padding:2px 8px;color:#22c55e;font-weight:800;margin-left:8px}
.rnd-hdr{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:900;color:#475569;letter-spacing:.12em;padding:10px 20px 4px;border-top:1px solid #1e293b;margin-top:4px;text-transform:uppercase}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1e293b;gap:12px}
.empty .ico{font-size:4rem}
/* 1V1 */
.s1v1{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:0 40px 20px;overflow:hidden}
.s1v1-col{display:flex;flex-direction:column;overflow:hidden}
.s1v1-col h3{font-family:'Orbitron',sans-serif;font-size:.8rem;color:#64748b;letter-spacing:.12em;margin-bottom:12px;flex-shrink:0}
.s1v1-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.mc{display:flex;align-items:center;border-radius:10px;overflow:hidden;border:1px solid rgba(139,92,246,.15);flex-shrink:0}
.mw{background:rgba(139,92,246,.2);padding:10px 16px;font-size:1rem;font-weight:800;color:#a78bfa;flex:1}
.mvs{background:#0d0d2b;padding:10px;font-size:.7rem;color:#334155;font-weight:700}
.ml{background:rgba(255,255,255,.02);padding:10px 16px;font-size:1rem;font-weight:700;color:#475569;flex:1;text-align:right}
.ftr{background:#0d0d2b;border-top:1px solid #1e293b;padding:6px 32px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.ftr span{font-size:.65rem;color:#334155;letter-spacing:.08em}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="sub">Żabkowe Mistrzostwa w</div><h1>TRIKI</h1></div>
  <div class="live"><div class="dot"></div>LIVE</div>
</div>
<div class="nav">
  <button class="nb active" style="--c:#f59e0b" onclick="showAll(this)">📊 Wszystkie</button>
  <button class="nb" style="--c:#22c55e" onclick="show('ninja',this)">🥷 Ninja Frog</button>
  <button class="nb" style="--c:#ef4444" onclick="show('bokser',this)">🥊 Bokser</button>
  <button class="nb" style="--c:#f59e0b" onclick="show('toss',this)">🎯 Toss</button>
  <button class="nb" style="--c:#10b981" onclick="show('snake',this)">🐍 Snake</button>
  <button class="nb" style="--c:#8b5cf6" onclick="show('snake1v1',this)">⚔️ Snake 1v1</button>
  <button class="nb" style="--c:#f97316" onclick="show('pilka',this)">⚽ Piłka Nożna</button>
  <button class="nb" style="--c:#a855f7" onclick="show('galaxy',this)">🚀 Galaxy</button>
</div>

<!-- WSZYSTKIE -->
<div class="view active" id="view-all">
  <div class="all-grid">
    <div class="ac" style="--c:#22c55e"><div class="ac-hdr">🥷 Ninja Frog <span id="ac-ninja"></span></div><div class="ac-list" id="al-ninja"></div></div>
    <div class="ac" style="--c:#ef4444"><div class="ac-hdr">🥊 Bokser <span id="ac-bokser"></span></div><div class="ac-list" id="al-bokser"></div></div>
    <div class="ac" style="--c:#f59e0b"><div class="ac-hdr">🎯 Toss <span id="ac-toss"></span></div><div class="ac-list" id="al-toss"></div></div>
    <div class="ac" style="--c:#10b981"><div class="ac-hdr">🐍 Snake <span id="ac-snake"></span></div><div class="ac-list" id="al-snake"></div></div>
    <div class="ac" style="--c:#8b5cf6"><div class="ac-hdr">⚔️ Snake 1v1 <span id="ac-snake1v1"></span></div><div class="ac-list" id="al-snake1v1"></div></div>
    <div class="ac" style="--c:#f97316"><div class="ac-hdr">⚽ Piłka Nożna <span id="ac-pilka"></span></div><div class="ac-list" id="al-pilka"></div></div>
    <div class="ac" style="--c:#a855f7"><div class="ac-hdr">🚀 Galaxy <span id="ac-galaxy"></span></div><div class="ac-list" id="al-galaxy"></div></div>
  </div>
</div>

<!-- SINGLE VIEWS -->
<div class="view" id="view-ninja"><div class="g-hdr"><span class="g-title" style="color:#22c55e">🥷 Ninja Frog</span><span class="g-cnt" id="gc-ninja"></span></div><div class="g-list" id="gl-ninja"></div></div>
<div class="view" id="view-bokser"><div class="g-hdr"><span class="g-title" style="color:#ef4444">🥊 Bokser</span><span class="g-cnt" id="gc-bokser"></span></div><div class="g-list" id="gl-bokser"></div></div>
<div class="view" id="view-toss"><div class="g-hdr"><span class="g-title" style="color:#f59e0b">🎯 Toss</span><span class="g-cnt" id="gc-toss"></span></div><div class="g-list" id="gl-toss"></div></div>
<div class="view" id="view-snake"><div class="g-hdr"><span class="g-title" style="color:#10b981">🐍 Snake</span><span class="g-cnt" id="gc-snake"></span></div><div class="g-list" id="gl-snake"></div></div>
<div class="view" id="view-snake1v1">
  <div class="g-hdr"><span class="g-title" style="color:#8b5cf6">⚔️ Snake 1v1</span><span class="g-cnt" id="gc-snake1v1"></span></div>
  <div class="s1v1">
    <div class="s1v1-col"><h3>KLASYFIKACJA GENERALNA</h3><div class="s1v1-list" id="gl-snake1v1"></div></div>
    <div class="s1v1-col"><h3>OSTATNIE MECZE</h3><div class="s1v1-list" id="gl-snake1v1-m"></div></div>
  </div>
</div>
<div class="view" id="view-pilka"><div class="g-hdr"><span class="g-title" style="color:#f97316">⚽ Piłka Nożna</span><span class="g-cnt" id="gc-pilka"></span></div><div class="g-list" id="gl-pilka"></div></div>

<div class="view" id="view-galaxy"><div class="g-hdr"><span class="g-title" style="color:#a855f7">🚀 Galaxy</span><span class="g-cnt" id="gc-galaxy"></span></div><div class="g-list" id="gl-galaxy"></div></div>

<div class="ftr"><span>LIVE — aktualizuje się automatycznie</span><span>top-art-agency.github.io/Ranking-Triki/</span></div>

<script>
const DB='https://ninja-frog-ranking-default-rtdb.europe-west1.firebasedatabase.app';
const POLL=5000;
var H={};

function show(k,b){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-'+k).classList.add('active');
  b.classList.add('active');
}
function showAll(b){show('all',b);}

function med(i){return i===0?'<span class="em">🥇</span>':i===1?'<span class="em">🥈</span>':i===2?'<span class="em">🥉</span>':`<span class="ep">${i+1}</span>`;}
function amed(i){return i===0?'<span class="am">🥇</span>':i===1?'<span class="am">🥈</span>':i===2?'<span class="am">🥉</span>':`<span class="ap">${i+1}</span>`;}

async function fetchDB(k){try{const r=await fetch(DB+'/'+k+'.json');return await r.json();}catch(e){return null;}}

async function pollGame(k,c){
  const val=await fetchDB(k);
  const h=JSON.stringify(val);
  if(h===H[k])return;
  H[k]=h;
  const entries=val?Object.values(val).sort((a,b)=>b.score-a.score):[];
  const n=entries.length;

  // all-view
  const al=document.getElementById('al-'+k);
  const ac=document.getElementById('ac-'+k);
  if(ac)ac.textContent=n?n+' zaw.':'';
  if(al)al.innerHTML=entries.map((e,i)=>`<div class="ar ${i<3?'ar'+(i+1):''}" style="--c:${c}">${amed(i)}<span class="an">${e.name}</span><span class="as">${e.score}</span></div>`).join('')||'<div style="padding:12px;color:#1e293b;font-size:.8rem">Brak wyników</div>';

  // single-view
  const gl=document.getElementById('gl-'+k);
  const gc=document.getElementById('gc-'+k);
  if(gc)gc.textContent=n+' zawodników';
  if(gl){
    if((k==='snake'||k==='pilka')&&entries.length&&entries[0].round){
      const rounds={};
      entries.forEach(e=>{const r=e.round||'?';if(!rounds[r])rounds[r]=[];rounds[r].push(e);});
      let html='';
      Object.keys(rounds).sort().forEach(r=>{
        html+=`<div class="rnd-hdr">Runda ${r}</div>`;
        rounds[r].sort((a,b)=>b.score-a.score).forEach((e,i)=>{
          const cls=i<3?'en'+(i+1):'enn';
          html+=`<div class="en ${cls}">${med(i)}<span class="ename">${e.name}</span><span class="escore" style="color:${c}">${e.score}</span></div>`;
        });
      });
      gl.innerHTML=html||'<div class="empty"><div class="ico">🎮</div><p>Brak wyników</p></div>';
    } else {
      gl.innerHTML=entries.map((e,i)=>{
        const cls=i<3?'en'+(i+1):'enn';
        const z=e.jury?`<span class="ezap">🐸 #${e.jury}</span>`:'';
        return `<div class="en ${cls}">${med(i)}<span class="ename">${e.name}${z}</span><span class="escore" style="color:${c}">${e.score}</span></div>`;
      }).join('')||'<div class="empty"><div class="ico">🎮</div><p>Brak wyników</p></div>';
    }
  }
}

async function poll1v1(){
  const val=await fetchDB('snake1v1');
  const h=JSON.stringify(val);
  if(h===H['s1v1'])return;
  H['s1v1']=h;
  const matches=val?Object.values(val).filter(m=>m.winner):[];
  const wins={};
  matches.forEach(m=>{wins[m.winner]=(wins[m.winner]||0)+1;});
  const sorted=Object.entries(wins).sort((a,b)=>b[1]-a[1]);

  const ac=document.getElementById('ac-snake1v1');
  const gc=document.getElementById('gc-snake1v1');
  if(ac)ac.textContent=sorted.length+' zaw.';
  if(gc)gc.textContent=matches.length+' meczów';

  const allHtml=sorted.map(([n,w],i)=>`<div class="ar ${i<3?'ar'+(i+1):''}" style="--c:#8b5cf6">${amed(i)}<span class="an">${n}</span><span class="as">${w}W</span></div>`).join('')||'<div style="padding:12px;color:#1e293b;font-size:.8rem">Brak meczów</div>';
  const al=document.getElementById('al-snake1v1');
  if(al)al.innerHTML=allHtml;

  const gl=document.getElementById('gl-snake1v1');
  if(gl)gl.innerHTML=sorted.map(([n,w],i)=>`<div class="en ${i<3?'en'+(i+1):'enn'}">${med(i)}<span class="ename">${n}</span><span class="escore" style="color:#8b5cf6">${w}<span style="font-size:.6rem;color:#64748b;font-family:'Nunito',sans-serif"> W</span></span></div>`).join('')||'<div class="empty"><div class="ico">⚔️</div><p>Brak meczów</p></div>';

  const ml=document.getElementById('gl-snake1v1-m');
  const recent=matches.slice(-10).reverse();
  if(ml)ml.innerHTML=recent.map(m=>`<div class="mc"><div class="mw">🏆 ${m.winner}</div><div class="mvs">VS</div><div class="ml">${m.loser||'?'}</div></div>`).join('')||'<div class="empty"><div class="ico">🏟️</div><p>Brak meczów</p></div>';
}

const GAMES=[['ninja','#22c55e'],['bokser','#ef4444'],['toss','#f59e0b'],['snake','#10b981'],['pilka','#f97316'],['galaxy','#a855f7']];

async function pollAll(){
  await Promise.all(GAMES.map(([k,c])=>pollGame(k,c)));
  await poll1v1();
}

pollAll();
setInterval(pollAll,POLL);
</script>
</body>
</html>
